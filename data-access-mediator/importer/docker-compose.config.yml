services:
  # container for executing config import scripts for creating the OpenHIM channels used by the Mediator
  data-access-config-importer:
    image: node:erbium-alpine
    networks:
      openhim:
      default:
    environment:
      OPENHIM_API_USERNAME: ${OPENHIM_USERNAME}
      OPENHIM_API_PASSWORD: ${OPENHIM_PASSWORD}
      # Reject unauthorised is only needed if the OpenHIM's SSL is not setup
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      OPENHIM_CONSOLE_BASE_URL: ${OPENHIM_CONSOLE_BASE_URL}
    command: sh -c "node openhimConfig.js"
    configs:
      - source: data-access-config-importer-openhimConfig.js
        target: /openhimConfig.js
      - source: data-access-config-importer-openhim-import.json
        target: /openhim-import.json
    deploy:
      replicas: 1
      restart_policy:
        condition: none

configs:
  data-access-config-importer-openhimConfig.js:
    file: ./volume/openhimConfig.js
    name: data-access-config-importer-openhimConfig.js-${data_access_config_importer_openhimConfig_js_DIGEST:?err}
    labels:
      name: data-access
  data-access-config-importer-openhim-import.json:
    file: ./volume/openhim-import.json
    name: data-access-config-importer-openhim-import.json-${data_access_config_importer_openhimConfig_js_DIGEST:?err}
    labels:
      name: data-access

networks:
  openhim:
    name: openhim_public
    external: true
  default:
