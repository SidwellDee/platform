version: "3.9"

services:
  jempi-alpha-01:
    image: ${DGRAPH_IMAGE}
    hostname: alpha-01
    ports:
      - published: 8070
        target: 8080
        protocol: tcp
        mode: host
      - published: 9080
        target: 9080
        protocol: tcp
        mode: host
    volumes:
      - jempi-alpha-01-data:/dgraph
      - /home/sidwelldlamini/eswatini_hie/backups/alpha_1:/dgraph/exports
    deploy:
      resources:
        limits:
          memory: ${DGRAPH_ALPHA_01_MEMORY_LIMIT}
        reservations:
          memory: ${DGRAPH_ALPHA_01_MEMORY_RESERVE}
      restart_policy:
        condition: on-failure
    command: dgraph alpha --my=jempi-alpha-01:7080 --zero=jempi-zero-01:5080,jempi-zero-02:5080,jempi-zero-03:5080 --security whitelist=0.0.0.0/0 --export /dgraph/backups
    networks:
      jempi:
      reverse-proxy:
    depends_on:
      - jempi-zero-01
      - jempi-zero-02
      - jempi-zero-03

  jempi-alpha-02:
    image: ${DGRAPH_IMAGE}
    hostname: alpha-02
    ports:
      - published: 8071
        target: 8080
        protocol: tcp
        mode: host
      - published: 9081
        target: 9080
        protocol: tcp
        mode: host
    volumes:
      - jempi-alpha-02-data:/dgraph
      - /home/sidwelldlamini/eswatini_hie/backups/alpha_2:/dgraph/backups
    deploy:
      resources:
        limits:
          memory: ${DGRAPH_ALPHA_01_MEMORY_LIMIT}
        reservations:
          memory: ${DGRAPH_ALPHA_01_MEMORY_RESERVE}
      restart_policy:
        condition: on-failure
    command: dgraph alpha --my=jempi-alpha-02:7080 --zero=jempi-zero-01:5080,jempi-zero-02:5080,jempi-zero-03:5080 --security whitelist=0.0.0.0/0
    networks:
      jempi:
      reverse-proxy:
    depends_on:
      - jempi-zero-01
      - jempi-zero-02
      - jempi-zero-03

  jempi-alpha-03:
    image: ${DGRAPH_IMAGE}
    hostname: alpha-03
    ports:
      - published: 8072
        target: 8080
        protocol: tcp
        mode: host
      - published: 9082
        target: 9080
        protocol: tcp
        mode: host
    volumes:
      - jempi-alpha-03-data:/dgraph
      - /home/sidwelldlamini/eswatini_hie/backups/alpha_3:/dgraph/backups
    deploy:
      resources:
        limits:
          memory: ${DGRAPH_ALPHA_01_MEMORY_LIMIT}
        reservations:
          memory: ${DGRAPH_ALPHA_01_MEMORY_RESERVE}
      restart_policy:
        condition: on-failure
    command: dgraph alpha --my=jempi-alpha-03:7080 --zero=jempi-zero-01:5080,jempi-zero-02:5080,jempi-zero-03:5080 --security whitelist=0.0.0.0/0
    networks:
      jempi:
      reverse-proxy:
    depends_on:
      - jempi-zero-01
      - jempi-zero-02
      - jempi-zero-03

  jempi-ratel:
    image: ${DGRAPH_RATEL_IMAGE}
    deploy:
      replicas: 1
      resources:
        limits:
          memory: ${DGRAPH_RATEL_MEMORY_LIMIT}
        reservations:
          memory: ${DGRAPH_RATEL_MEMORY_RESERVE}
      restart_policy:
        condition: on-failure
    command: dgraph-ratel
    networks:
      jempi:
      reverse-proxy:

volumes:
  jempi-alpha-01-data:
  jempi-alpha-02-data:
  jempi-alpha-03-data:

networks:
  jempi:
    name: jempi_public
    external: true
  reverse-proxy:
    name: reverse-proxy_public
    external: true
