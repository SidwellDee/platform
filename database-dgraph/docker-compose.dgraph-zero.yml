version: "3.9"

services:
  jempi-zero-01:
    image: ${DGRAPH_IMAGE}
    volumes:
      - jempi-zero-01-data:/dgraph
    deploy:
      restart_policy:
        condition: on-failure
    command: dgraph zero --my=jempi-zero-01:5080 --replicas=3 --raft idx=1
    networks:
      jempi:

  jempi-zero-02:
    image: ${DGRAPH_IMAGE}
    volumes:
      - jempi-zero-02-data:/dgraph
    deploy:
      restart_policy:
        condition: on-failure
    restart: unless-stopped
    command: dgraph zero --my=jempi-zero-02:5080 --replicas=3 --peer=jempi-zero-01:5080 --raft idx=2
    networks:
      jempi:
    depends_on:
      - jempi-zero-01

  jempi-zero-03:
    image: ${DGRAPH_IMAGE}
    volumes:
      - jempi-zero-03-data:/dgraph
    deploy:
      restart_policy:
        condition: on-failure
    restart: unless-stopped
    command: dgraph zero --my=jempi-zero-03:5080 --replicas=3 --peer=jempi-zero-01:5080 --raft idx=3
    networks:
      jempi:
    depends_on:
      - jempi-zero-01

volumes:
  jempi-zero-01-data:
  jempi-zero-02-data:
  jempi-zero-03-data:

networks:
  jempi:
    name: jempi_public
    external: true
